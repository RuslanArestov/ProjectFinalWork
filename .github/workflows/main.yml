name: Deploy Nginx-app

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          export PATH="$HOME/bin:$PATH" >> $GITHUB_ENV
  
      - name: Login to YCR
        run: |
          cat <<EOF > key.json
          ${{ secrets.YANDEX_CONTAINER_REGISTRY_AUTH }}
          EOF
          yc config set service-account-key key.json
          yc container registry configure-docker

      - name: Build Docker image
        run: |
          IMAGE="cr.yandex/cr.yandex/crp4j5bli6ctb3qlf1kr/nginx-app"
          TAG="${GITHUB_SHA::7}"
          docker build -t $IMAGE:$TAG .
          docker tag $IMAGE:$TAG $IMAGE:latest

      - name: Push Docker image
        run: |
          IMAGE="cr.yandex/cr.yandex/crp4j5bli6ctb3qlf1kr/nginx-app"
          TAG="${GITHUB_SHA::7}"
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Save tag
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Update Deployment in K8s
        run: |
          IMAGE="cr.yandex/cr.yandex/crp4j5bli6ctb3qlf1kr/nginx-app"
          kubectl set image deployment/nginx-app \
            nginx-app=$IMAGE:${{ env.TAG }} \
            -n app
